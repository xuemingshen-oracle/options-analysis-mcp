[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "options-analysis-mcp"
version = "0.9.0"
description = "Provider-pluggable, read-only options data and analysis services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=2.2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
options-analysis-mcp = "options_analysis.mcp.server:main"
options-analysis-replay-sample = "options_analysis.providers.replay.cli:main"
options-analysis-schwab-auth = "options_analysis.providers.schwab.cli:main"
options-analysis-schwab-smoke = "options_analysis.providers.schwab.cli:smoke_main"
options-analysis-web = "options_analysis.web.server:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/options_analysis"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["options_analysis"]
mypy_path = "src"
